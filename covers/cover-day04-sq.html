<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  body {
    background:#F6F3EC;
    font-family:"PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif;
    color:#16150F;
  }
  .cover { position:relative; width:1080px; height:1080px; overflow:hidden; }
  .spine { position:absolute; right:0; top:0; width:14px; height:100%; background:#E4391F; }

  .top {
    position:absolute; left:72px; right:110px; top:70px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .kicker {
    font-family:"SF Mono",Menlo,monospace;
    font-size:15px; letter-spacing:4px; color:#8A8578;
    display:flex; align-items:center; gap:14px;
  }
  .dot { width:9px; height:9px; background:#E4391F; flex:0 0 auto; }
  .no { font-family:"SF Mono",Menlo,monospace; font-size:15px; letter-spacing:3px; color:#8A8578; }

  .main {
    position:absolute; left:72px; right:110px; top:300px;
    display:flex; align-items:center; gap:44px;
  }
  .daycol { display:flex; flex-direction:column; align-items:flex-start; }
  .daylabel {
    font-family:"SF Mono",Menlo,monospace;
    font-size:16px; letter-spacing:9px; color:#8A8578;
    margin-left:8px; margin-bottom:4px;
  }
  .daynum {
    font-size:270px; line-height:0.86; font-weight:800;
    color:#E4391F; letter-spacing:-4px;
    -webkit-text-stroke:1px #E4391F;
  }
  .hr { width:1px; height:300px; background:#CFC8B8; flex:0 0 auto; }

  .txt { padding-top:2px; }
  .lead {
    font-size:31px; font-weight:500; letter-spacing:3px; color:#6F6A5E;
    margin-bottom:20px; white-space:nowrap;
  }
  .code {
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:64px; line-height:1.1; font-weight:700;
    letter-spacing:-1px; white-space:nowrap; color:#16150F;
  }
  .code .ar { color:#E4391F; font-weight:400; padding:0 5px; }
  .strike { position:relative; }
  .strike::after {
    content:""; position:absolute; left:-4px; right:-4px; top:52%;
    height:6px; background:#E4391F; transform:rotate(-6deg);
  }
  .ok { color:#E4391F; }
  .sub {
    margin-top:22px;
    font-size:24px; font-weight:400; letter-spacing:2px; color:#8A8578;
    white-space:nowrap;
  }
  .sub b { font-weight:600; color:#4A4740; }

  .foot { position:absolute; left:72px; right:110px; bottom:76px; }
  .rule { height:1px; background:#D8D2C4; margin-bottom:18px; }
  .footrow {
    display:flex; align-items:center; justify-content:space-between;
    font-family:"SF Mono",Menlo,monospace;
    font-size:15px; letter-spacing:2px; color:#8A8578;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="spine"></div>

  <div class="top">
    <div class="kicker"><span class="dot"></span>FRONTEND → FULL-STACK</div>
    <div class="no">JAVA / 04</div>
  </div>

  <div class="main">
    <div class="daycol">
      <div class="daylabel">DAY</div>
      <div class="daynum">04</div>
    </div>
    <div class="hr"></div>
    <div class="txt">
      <div class="lead">前端转全栈第 4 天</div>
      <div class="code"><span class="strike">push()</span><span class="ar">→</span><span class="ok">int[5]</span></div>
      <div class="sub"><b>数组</b> · 方法 · 重载 · 值传递</div>
    </div>
  </div>

  <div class="foot">
    <div class="rule"></div>
    <div class="footrow">
      <div>ARRAY / METHOD / OVERLOAD</div>
      <div>2026.11.05</div>
    </div>
  </div>
</div>
</body>
</html>
